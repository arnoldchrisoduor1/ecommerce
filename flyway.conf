# Flyway configuration.
#
# flyway.url / flyway.user / flyway.password are intentionally NOT set here.
# Flyway auto-maps env vars FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD onto
# these settings, so credentials come from docker-compose environment vars
# (sourced from POSTGRES_* / DATABASE_URL-derived values), never from this file.
#
# Note: the Go backend connects via a single DATABASE_URL (postgres:// scheme).
# Flyway requires a JDBC URL (jdbc:postgresql://host:port/db) instead, so
# FLYWAY_URL is set separately in docker-compose.yml rather than reusing
# DATABASE_URL directly.

flyway.locations=filesystem:/flyway/sql
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
