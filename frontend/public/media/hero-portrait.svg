<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-label="Full-body portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <!-- head -->
  <circle cx="450" cy="220" r="110" fill="#a16207"/>
  <text x="450" y="230" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="42">HEAD</text>
  <!-- torso -->
  <rect x="300" y="360" width="300" height="420" rx="20" fill="#52525b"/>
  <text x="450" y="580" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="36">TORSO</text>
  <!-- legs -->
  <rect x="320" y="800" width="100" height="520" rx="16" fill="#3f3f46"/>
  <rect x="480" y="800" width="100" height="520" rx="16" fill="#3f3f46"/>
  <text x="450" y="1480" text-anchor="middle" fill="#a16207" font-family="Georgia, serif" font-size="42">FEET</text>
  <line x1="120" y1="80" x2="780" y2="80" stroke="#a16207" stroke-width="4"/>
  <line x1="120" y1="1520" x2="780" y2="1520" stroke="#a16207" stroke-width="4"/>
</svg>
