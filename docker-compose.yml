services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce}
      FLYWAY_USER: ${POSTGRES_USER:-ecommerce}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    volumes:
      - ./db/migrations:/flyway/sql
      - ./flyway.conf:/flyway/conf/flyway.conf
    command: migrate

  # Official minio/* Hub images removed; coollabsio + alpine/mc binary.
  minio:
    image: coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # coollabsio image has no curl; TCP probe is enough for depends_on.
      test: ["CMD-SHELL", "timeout 3s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: ecommerce-createbuckets:local
    build:
      context: ./deploy
      dockerfile: Dockerfile.createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb -p "local/$${MINIO_BUCKET:-ecommerce}" || true
        mc anonymous set download "local/$${MINIO_BUCKET:-ecommerce}"
        exit 0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecommerce}

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_ADDR: redis:6379
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      PORT: ${PORT:-8080}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-only-change-me-to-a-long-random-string-at-least-32-chars}
      PRESENCE_TTL_SECONDS: ${PRESENCE_TTL_SECONDS:-60}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_STYLIST_MOCK_MODE: ${AI_STYLIST_MOCK_MODE:-false}
      OPENROUTER_TRYON_MODEL: ${OPENROUTER_TRYON_MODEL:-}
      AI_TRYON_MOCK_MODE: ${AI_TRYON_MOCK_MODE:-false}
      MINIO_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-${MINIO_ENDPOINT:-minio:9000}}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-${MINIO_ENDPOINT:-minio:9000}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecommerce}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/ecommerce}}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/ecommerce}}
    ports:
      - "8081:${PORT:-8080}"

volumes:
  postgres_data:
  redis_data:
  minio_data:
